spring.application.name=intern-assignment

spring.datasource.url=jdbc:h2:mem:assigndb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_EMAIL}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

assignment.email.to=${ASSIGNMENT_EMAIL_TO:hr@ignitershub.com}
assignment.email.subject=${ASSIGNMENT_EMAIL_SUBJECT:Challenge 3 Completed}
assignment.sender.name=${SENDER_NAME:}
assignment.sender.semester=${SENDER_SEMESTER:}
assignment.sender.branch=${SENDER_BRANCH:}
assignment.sender.roll-number=${SENDER_ROLL_NUMBER:}
assignment.sender.college=${SENDER_COLLEGE:}
assignment.repo.url=${ASSIGNMENT_REPO_URL:https://github.com/Devsharma08/IgnitersHubProjects}
